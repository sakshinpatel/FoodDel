<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" width="250" height="60">
  <defs>
    <linearGradient id="adminLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#D93D20"/>
    </linearGradient>
    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon -->
  <g transform="translate(6, 6)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="#111827" filter="url(#adminGlow)"/>
    <rect x="1" y="1" width="46" height="46" rx="13" fill="none" stroke="#FF5A36" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Cloche dome -->
    <path d="M14 28 C14 19, 34 19, 34 28 Z" fill="url(#adminLogoGrad)"/>
    <!-- Cloche knob -->
    <circle cx="24" cy="17" r="2.5" fill="#FF5A36"/>
    <!-- Platter tray -->
    <rect x="11" y="30" width="26" height="3" rx="1.5" fill="#FFFFFF"/>
    <!-- Cart wheels -->
    <circle cx="18" cy="37" r="2.5" fill="#FFFFFF"/>
    <circle cx="30" cy="37" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(64, 38)">
    <!-- 'Crave' in deep charcoal -->
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#111827" letter-spacing="-0.5px">Crave</text>
    <!-- 'Kart' in vibrant primary -->
    <text x="70" y="0" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#FF5A36" letter-spacing="-0.5px">Kart</text>
    
    <!-- Admin Panel Badge -->
    <rect x="126" y="-19" width="56" height="22" rx="6" fill="#111827"/>
    <text x="133" y="-4" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF" letter-spacing="1px">ADMIN</text>
    <!-- Tagline underneath -->
    <text x="2" y="14" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#6B7280" letter-spacing="1.5px">CONTROL DASHBOARD</text>
  </g>
</svg>
