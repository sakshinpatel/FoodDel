<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#D93D20"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF5A36" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Brand Mark Icon -->
  <g transform="translate(6, 6)">
    <!-- Icon Container -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#logoPrimaryGrad)" filter="url(#softGlow)"/>
    
    <!-- Cloche dome -->
    <path d="M14 28 C14 19, 34 19, 34 28 Z" fill="#FFFFFF"/>
    <!-- Cloche knob -->
    <circle cx="24" cy="17" r="2.5" fill="#FFFFFF"/>
    <!-- Platter tray -->
    <rect x="11" y="30" width="26" height="3" rx="1.5" fill="#FFFFFF"/>
    <!-- Cart wheels -->
    <circle cx="18" cy="37" r="2.5" fill="#FFFFFF"/>
    <circle cx="30" cy="37" r="2.5" fill="#FFFFFF"/>
    <!-- Motion lines -->
    <line x1="8" y1="37" x2="13" y2="37" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(64, 40)">
    <!-- 'Crave' in deep charcoal -->
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#111827" letter-spacing="-0.5px">Crave</text>
    <!-- 'Kart' in vibrant primary -->
    <text x="82" y="0" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="800" fill="#FF5A36" letter-spacing="-0.5px">Kart</text>
    <!-- Accent Dot -->
    <circle cx="144" cy="-5" r="4" fill="#FF5A36"/>
    <!-- Tagline underneath -->
    <text x="2" y="12" font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#6B7280" letter-spacing="2px">FOOD DELIVERY</text>
  </g>
</svg>
